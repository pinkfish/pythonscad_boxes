name: docs

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

# Serialize deploys: a release and a dev push must not race on gh-pages.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    # Intel macOS: the ``pythonscad-example`` blocks render through the real
    # PythonSCAD binary (installed below), which has software-renderer issues on
    # arm64. Python 3.14 matches the Python the app bundles, so the rendered
    # snippets can import pybosl2/shapely from this interpreter's site-packages.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm reads the version from the tag; the full history and
          # tags must be present, not a shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Install PythonSCAD
        run: |
          curl -fsSL -o /tmp/PythonSCAD.dmg \
            "https://github.com/pythonscad/pythonscad/releases/download/v1.1.2/PythonSCAD-v1.1.2.dmg"
          hdiutil attach /tmp/PythonSCAD.dmg -nobrowse -mountpoint /tmp/PythonSCAD-mount
          cp -R /tmp/PythonSCAD-mount/PythonSCAD.app /Applications/
          hdiutil detach /tmp/PythonSCAD-mount
          test -x /Applications/PythonSCAD.app/Contents/MacOS/PythonSCAD

      - name: Resolve version and destination
        id: target
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "destination=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "destination=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build documentation
        env:
          PYBOXBUILDER_VERSION: ${{ steps.target.outputs.version }}
        run: sphinx-build -b html docs docs/_build/html

      # keep_files keeps every version beside each other on the gh-pages branch:
      # /dev/, /v1.2.3/, /v1.3.0/, ... accumulate instead of replacing each other.
      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: docs/_build/html
          destination_dir: ${{ steps.target.outputs.destination }}
          keep_files: true
          enable_jekyll: false

      # A release also promotes its versioned docs as the stable documentation.
      - name: Promote release docs to stable
        if: github.ref_type == 'tag'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: docs/_build/html
          destination_dir: stable
          keep_files: true
          enable_jekyll: false
