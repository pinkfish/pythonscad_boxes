name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pybosl2 numpy fpdf2 shapely pillow pythonscad
          pip install -e .

      # PythonSCAD AppImage supplies the headless render binary the golden-image
      # tests shell out to.
      - name: Install PythonSCAD
        run: |
          curl -fsSL -o /tmp/pythonscad.AppImage \
            "https://github.com/pythonscad/pythonscad/releases/download/v1.1.2/PythonSCAD-1.1.2-qt6-x86_64-x86_64.AppImage"
          chmod +x /tmp/pythonscad.AppImage
          cd /tmp && /tmp/pythonscad.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/pythonscad
          sudo ln -sf /opt/pythonscad/AppRun /usr/local/bin/pythonscad
          test -x /opt/pythonscad/AppRun
          test -x /usr/local/bin/pythonscad

      # Golden-image render tests: render each base box type and pattern through
      # the real PythonSCAD binary and compare against the committed PNG.
      - name: Run golden render tests
        env:
          PYTHONPATH: ".:tests"
        run: python -m pytest tests/test_pyboxbuilder/render/test_boxes_golden.py tests/test_pyboxbuilder/render/test_patterns_golden.py -q

      # Pure-Python tests of the base library. --base-only dynamically excludes all
      # 41 game-specific box insert test suites in boxes/ and test_ci_smoke.py.
      # The export path is not part of a CI pass: export() tessellates and writes
      # 3MFs, which is `make export`'s job, not a test's. `-k "not export"` drops
      # the export-focused test classes.
      - name: Run fast pure-Python base tests
        env:
          PYTHONPATH: ".:tests"
        run: |
          python -m pytest tests/test_pyboxbuilder/ -q \
            --base-only \
            --ignore=tests/test_pyboxbuilder/render \
            -k "not export"
