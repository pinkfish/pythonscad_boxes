name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pybosl2 numpy fpdf2
          pip install -e .

      # A CI pass is not a build. It verifies the pipeline's decisions — which
      # files get written, skipped, cached and deleted — none of which depend on
      # curve tessellation, so exports run at a draft facet count and write only
      # to temporary directories. The print-quality 3MFs are produced by an
      # actual `project.export(...)` run, not here.
      - name: Run fast pure-Python tests (draft precision, no printable output)
        env:
          PYBOXBUILDER_EXPORT_FN: "12"
        run: python -m pytest tests/test_pyboxbuilder/ -q

      # Geometry coverage without printable output: builds every example
      # through the same path `show()` uses, writing no files.
      - name: Build every example through the preview path
        run: python -m pytest tests/test_pyboxbuilder/test_ci_smoke.py -q

      # Blocking, both of them. These ran with `|| true` for long enough that
      # `lid/color_layers.py` sat in the tree using `@dataclass` without
      # importing it — a module that raised on import, and that nothing
      # imported, so its part of FR-022 had never run. A type checker whose
      # result is discarded is not a type checker.
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check pyboxbuilder/ boxes/

      - name: Type check
        run: |
          python -m pip install mypy
          mypy pyboxbuilder/
