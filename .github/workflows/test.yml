name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the Python the PythonSCAD app bundles (3.14): the render
      # subprocess imports pybosl2/shapely from this interpreter's site-packages,
      # and shapely ships version-specific compiled extensions.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pybosl2 numpy fpdf2 shapely pillow pythonscad
          pip install -e .

      # PythonSCAD's native runtime is what turns pybosl2 CSG into real
      # geometry: the `pythonscad` pip wheel above supplies the `openscad` /
      # `pythonscad` modules, and this app bundle supplies the headless render
      # binary the golden-image tests shell out to. The DMG is a universal
      # (x86_64 + arm64) bundle, so it runs on the arm64 runner natively.
      - name: Install PythonSCAD
        run: |
          curl -fsSL -o /tmp/PythonSCAD.dmg \
            "https://github.com/pythonscad/pythonscad/releases/download/v1.1.2/PythonSCAD-v1.1.2.dmg"
          hdiutil attach /tmp/PythonSCAD.dmg -nobrowse -mountpoint /tmp/PythonSCAD-mount
          cp -R /tmp/PythonSCAD-mount/PythonSCAD.app /Applications/
          hdiutil detach /tmp/PythonSCAD-mount
          test -x /Applications/PythonSCAD.app/Contents/MacOS/PythonSCAD

      # Golden-image render tests: render each box/pattern through the real
      # PythonSCAD binary and compare against the committed PNG.
      - name: Run golden render tests
        run: python -m pytest tests/test_pyboxbuilder/render/test_boxes_golden.py tests/test_pyboxbuilder/render/test_patterns_golden.py -q

      # Geometry coverage without printable output: builds every example
      # through the same path `show()` uses, writing no files.
      - name: Build every example through the preview path
        run: python -m pytest tests/test_pyboxbuilder/test_ci_smoke.py -q

      # Fast pure-Python tests. The export path is not part of a CI pass:
      # export() tessellates and writes 3MFs, which is `make export`'s job,
      # not a test's. `-k "not export"` drops the export-focused test classes,
      # and `--ignore` skips the golden/render directory and the preview smoke
      # test (both already run above).
      - name: Run fast pure-Python tests
        run: |
          python -m pytest tests/test_pyboxbuilder/ -q \
            --ignore=tests/test_pyboxbuilder/render \
            --ignore=tests/test_pyboxbuilder/test_ci_smoke.py \
            -k "not export"

      # Blocking, both of them. These ran with `|| true` for long enough that
      # `lid/color_layers.py` sat in the tree using `@dataclass` without
      # importing it — a module that raised on import, and that nothing
      # imported, so its part of FR-022 had never run. A type checker whose
      # result is discarded is not a type checker.
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check pyboxbuilder/ boxes/

      - name: Type check
        run: |
          python -m pip install mypy
          mypy pyboxbuilder/
