name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm reads the version from the git tag, so the full
          # history (and the tags) must be present, not a shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve version from tag
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag '$GITHUB_REF_NAME' does not look like a version tag"; exit 1 ;;
          esac

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # The built wheel/sdist must carry the tag's version, not a stale one.
      - name: Verify the built version and package contents
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ls -1 dist/
          test -f "dist/pythonscad_boxes-${VERSION}.tar.gz"
          test -f "dist/pythonscad_boxes-${VERSION}-py3-none-any.whl"
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          if "pyboxbuilder/py.typed" not in names:
              raise SystemExit(f"{wheel.name} is missing pyboxbuilder/py.typed")
          print(f"{wheel.name}: verified ({len(names)} files, py.typed present)")
          PY

      - name: Verify clean virtualenv install and import
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install --quiet --upgrade pip
          /tmp/release-check/bin/pip install --quiet dist/*.whl
          /tmp/release-check/bin/python -c "import pyboxbuilder; print('import ok:', pyboxbuilder.Project)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        
