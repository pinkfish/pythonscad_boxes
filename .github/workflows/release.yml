name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm reads the version from the git tag, so the full
          # history (and the tags) must be present, not a shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version from tag
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag '$GITHUB_REF_NAME' does not look like a version tag"; exit 1 ;;
          esac

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # The built wheel/sdist must carry the tag's version, not a stale one.
      - name: Verify the built version matches the tag
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ls -1 dist/
          ls -1 dist/ | grep -q "pyboxbuilder-${VERSION}" || {
            echo "built artifacts do not match tag version ${VERSION}"
            exit 1
          }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
