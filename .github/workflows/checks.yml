name: checks

on:
  push:
  pull_request:

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches [tool.mypy] python_version in pyproject.toml.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy

      # Blocking, both of them. A lint or type check whose result is discarded
      # is not a check.
      - name: Lint
        run: ruff check pyboxbuilder/ boxes/

      - name: Type check
        run: mypy pyboxbuilder/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Install PythonSCAD
        run: |
          curl -fsSL -o /tmp/pythonscad.AppImage \
            "https://github.com/pythonscad/pythonscad/releases/download/v1.1.2/PythonSCAD-1.1.2-qt6-x86_64-x86_64.AppImage"
          chmod +x /tmp/pythonscad.AppImage
          cd /tmp && /tmp/pythonscad.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/pythonscad
          sudo ln -sf /opt/pythonscad/AppRun /usr/local/bin/pythonscad
          test -x /opt/pythonscad/AppRun
          test -x /usr/local/bin/pythonscad

      # STLs are pre-generated in docs/_extra/_stl/ and committed to git;
      # the PythonSCAD binary is also installed above so any newly added or
      # changed examples can be rendered. Broken cross-references surface as
      # "reference target not found" / "unknown document" warnings, which we
      # treat as failures.
      - name: Build docs
        run: |
          sphinx-build -b html docs docs/_build/html 2>&1 | tee /tmp/docs-build.log
          if grep -qE "reference target not found|unknown document|undefined label|toctree contains reference" /tmp/docs-build.log; then
            echo "::error::broken internal cross-reference in the docs"
            exit 1
          fi

      - name: Check external links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
