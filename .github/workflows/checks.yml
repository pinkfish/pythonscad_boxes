name: checks

on:
  push:
  pull_request:

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches [tool.mypy] python_version in pyproject.toml.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy

      # Blocking, both of them. A lint or type check whose result is discarded
      # is not a check.
      - name: Lint
        run: ruff check pyboxbuilder/ boxes/

      - name: Type check
        run: mypy pyboxbuilder/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # No PythonSCAD binary on this runner, so the pythonscad-example blocks
      # render source-only instead of exporting STLs — but the build still
      # proves the directive runs, the docs extensions import, and the whole
      # tree builds. Broken cross-references surface as "reference target not
      # found" / "unknown document" warnings, which we treat as failures.
      - name: Build docs
        run: |
          sphinx-build -b html docs docs/_build/html 2>&1 | tee /tmp/docs-build.log
          if grep -qE "reference target not found|unknown document|undefined label|toctree contains reference" /tmp/docs-build.log; then
            echo "::error::broken internal cross-reference in the docs"
            exit 1
          fi

      - name: Check external links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
