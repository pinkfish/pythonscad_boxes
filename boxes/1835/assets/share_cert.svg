<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Railroad stock share certificate with wax seal & ribbons (filled shapes only, no strokes) -->
  <!-- Header banner -->
  <polygon fill="#000000" points="10,12 90,12 90,26 10,26" />
  <!-- Left, right & bottom document borders -->
  <polygon fill="#000000" points="10,30 18,30 18,88 10,88" />
  <polygon fill="#000000" points="82,30 90,30 90,54 82,54" />
  <polygon fill="#000000" points="10,80 55,80 55,88 10,88" />
  <!-- Certificate ledger lines -->
  <polygon fill="#000000" points="24,36 76,36 76,43 24,43" />
  <polygon fill="#000000" points="24,50 64,50 64,57 24,57" />
  <polygon fill="#000000" points="24,64 54,64 54,71 24,71" />
  <!-- Wax seal & twin ribbons -->
  <circle cx="74" cy="69" r="13" fill="#000000" />
  <polygon fill="#000000" points="64,79 60,95 68,90 73,95 73,81" />
  <polygon fill="#000000" points="75,81 75,95 80,90 88,95 84,79" />
</svg>
