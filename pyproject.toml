[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyboxbuilder"
dynamic = ["version"]
description = "Board game box/insert design library for PythonSCAD"
requires-python = ">=3.10"
dependencies = [
    # 0.7.7 or newer: path fixes, the Color class, Region.even_odd, and the SVG loader speed fix
    # (shapes.py loads drawings via Region.from_svg; 0.7.6 takes 196s on one file). Path2D/Path3D default to
    # closed=False there (so every outline meant as a polygon passes closed=True explicitly),
    # Path.tangents returns one tangent per point, and smooth_path/round_corners match BOSL2.
    # On 0.7.1 the box outlines silently lose their closing edge and the lids round wrong.
    "pybosl2>=0.7.7",
    "numpy",
]
authors = [{ name = "pinkfish" }]

[project.scripts]
pybox = "pyboxbuilder.cli:main"

[project.optional-dependencies]
scripts = [
    "pybosl2>=0.7.7",
    "lark",
    "fpdf",
    "inkex",
    "numpy",
    "shapely",
    "svgelements",
    "simplepath",
]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "fpdf2",
    "pillow",
    "shapely",
]
docs = [
    # sphinx<9: sphinx-immaterial 0.13.x is not yet compatible with Sphinx 9
    # (its apidoc python synopses integration raises KeyError: 'synopses').
    "sphinx>=7,<9",
    "sphinx-immaterial>=0.13",
    # autodoc imports pyboxbuilder, whose geometry modules import shapely
    # through pybosl2; without it the API reference fails to build.
    "shapely",
]

[tool.setuptools.packages.find]
include = ["pyboxbuilder*"]

[tool.setuptools.package-data]
pyboxbuilder = ["py.typed"]

# Version is derived from the git tag (`v1.2.3` -> `1.2.3`) so a release is
# tagged, not hand-edited. The fallback covers building from an sdist (no .git).
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
# The checks that catch real defects here — a name that is not on the object, an
# argument of the wrong type, a subscript into something that is not indexable.
# That class is exactly what let the spec dict drift: `spec.get("rim_free")`
# against a spec that never carried the key type-checks fine as a dict and is an
# error against a class. These are **blocking in CI**; a type checker run with
# `|| true`, as this one was, is decoration.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
# Calls into pybosl2 (no py.typed) and fpdf are untyped; flagging them as
# `untyped-call` would drown out the real errors in our own code. Everything
# else in `strict` that is worth having is on above.
disallow_untyped_calls = false
exclude = [
    "^tests/",
    "^boxes/",
    "^\\.venv/",
]

# pybosl2 ships no py.typed marker, so every geometry import reports as
# untyped. Sixty of those drowned out the errors in our own code, and mypy
# gave up before checking most of it — which is how the type checker came to
# be run with `|| true` in CI and stopped meaning anything.
[[tool.mypy.overrides]]
module = ["pybosl2.*", "openscad", "fpdf", "numpy.*", "compartments"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "UP",  # pyupgrade
    "D",   # pydocstyle (docstrings)
]
ignore = [
    # `w, l, h` is how this codebase — and OpenSCAD — names a box's three
    # dimensions, and `l` is unambiguous beside the other two. Renaming forty
    # of them to satisfy a rule about `l` looking like `1` would make the
    # geometry harder to read, not easier.
    "E741",
    # A geometry library writes math in math: ×, −, µ, ² and – in docstrings and
    # error messages are notation, not look-alike typos. Replacing them with
    # ASCII would make the dimensions less precise.
    "RUF001", "RUF002", "RUF003",
    # The library documents dataclass fields as attributes with their own
    # docstrings (see Project), so a class with a dataclass-generated __init__
    # does not need a separate __init__ docstring.
    "D107",
    # A class whose sole job is to group related methods (builders) reads
    # better with its members documented than with a restated summary.
    "D101",
]

[tool.ruff.lint.per-file-ignores]
# An example has to put the repo root on sys.path before it can import the
# library, so its imports cannot come first. Examples are user-facing scripts,
# not the library API, so the docstring rules do not apply to them either.
"boxes/*" = ["E402", "D"]
# Tests and docs build tooling are not the library API either.
"tests/*" = ["D"]
"docs/*" = ["D"]

[tool.ruff.format]
quote-style = "double"
