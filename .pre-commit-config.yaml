# Run `pre-commit install` once to wire these hooks into your git checkout.
# They run on every staged change and mirror what CI enforces in test.yml
# (ruff check pyboxbuilder/ boxes/).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(pyboxbuilder|boxes)/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # mypy needs the whole package, not just the staged files.
        args: [pyboxbuilder/]
        pass_filenames: false
